[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcontrol-linux"
version = "0.1.0"
description = "Linux controller for Sennheiser headphones (MOMENTUM True Wireless 4 and other GAIA-based models)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
smartcontrol = "smartcontrol.cli:main"

[project.gui-scripts]
smartcontrol-gui = "smartcontrol.gui:main"

[tool.setuptools]
packages = ["smartcontrol"]

[tool.setuptools.package-data]
smartcontrol = ["icons/*.svg"]
